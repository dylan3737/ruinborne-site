<title>Ruinborne</title>
<link rel="icon" href="icon.png" />
<style>
  :root { --bg: #f7f3fa; --ink: #2a2238; --soft: #6b6080; --accent: #c2185b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #221c30; --ink: #f4eef8; --soft: #b9adc9; --accent: #ff7aa2; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  img { width: 120px; height: 120px; border-radius: 26px; }
  h1 { font-size: 2.4rem; margin: 16px 0 4px; }
  p { color: var(--soft); margin: 0 0 24px; }
  a { color: var(--accent); }
</style>
</head>

  <img src="icon.png" alt="Ruinborne icon" />
